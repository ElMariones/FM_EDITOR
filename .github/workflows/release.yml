name: Release

# Push a version tag (git tag v0.1.0 && git push origin v0.1.0) to build the Windows
# download and publish it as a GitHub release. Run it by hand to rebuild an existing tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --configuration Release

      # The version comes from the tag, so v0.2.0 shows as v0.2.0 in the app. The zip keeps the
      # same name in every release, so .../releases/latest/download/FMOpenEditor-win-x64.zip (the
      # README's download button) always fetches the newest version.
      - name: Publish
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          dotnet publish src/FMOpenEditor.App -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none `
            -p:Version=$version -o publish/FMOpenEditor
          Copy-Item LICENSE publish/FMOpenEditor/
          @"
          FM OpenEditor $env:TAG
          =====================

          1. Start Football Manager 2027 and load your save.
          2. Double-click FMOpenEditor.exe (keep it in this folder, next to definitions and presets).
          3. Click "Connect to Football Manager".

          If Windows says "Windows protected your PC", click "More info", then "Run anyway".
          If the game runs as administrator, right-click FMOpenEditor.exe and choose "Run as administrator".

          Back up your save before editing. Single-player only.

          Help, bug reports and new versions: https://github.com/ElMariones/FM_EDITOR
          "@ | Set-Content -Encoding utf8 "publish/FMOpenEditor/READ ME FIRST.txt"
          Compress-Archive -Path publish/FMOpenEditor/* -DestinationPath FMOpenEditor-win-x64.zip
          (Get-FileHash FMOpenEditor-win-x64.zip -Algorithm SHA256).Hash | Set-Content -Encoding ascii FMOpenEditor-win-x64.zip.sha256

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: FM OpenEditor ${{ env.TAG }}
          files: |
            FMOpenEditor-win-x64.zip
            FMOpenEditor-win-x64.zip.sha256
          make_latest: true
          generate_release_notes: true
          body: |
            ## ⬇️ Download

            **[Download FMOpenEditor-win-x64.zip](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/FMOpenEditor-win-x64.zip)** (also under *Assets* below). Windows 10 or 11, 64-bit. Nothing else to install.

            ### How to run it

            1. **Download** the zip above.
            2. **Unzip it**: right-click the file → *Extract All…* → *Extract*. Put the folder wherever you like (Desktop, Documents…).
            3. **Start Football Manager 2027** and load your save.
            4. **Open the folder and double-click `FMOpenEditor.exe`.**
            5. Click **Connect to Football Manager**. Edit, then press **Save changes**.

            **"Windows protected your PC"?** The app isn't code-signed yet, so Windows doesn't recognise it. Click **More info → Run anyway**. It's open source: every line is in this repository.

            **"Football Manager isn't running" but it is?** If the game runs as administrator, right-click `FMOpenEditor.exe` → **Run as administrator**.

            ⚠️ Back up your save before editing, and only use it in single-player careers.

            To update, download the new zip and replace the old folder. Your settings and presets are kept.
